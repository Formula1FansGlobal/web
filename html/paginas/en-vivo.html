<!DOCTYPE html>
<html lang="es">
<head>
    <meta content="text/html; charset=UTF-8" http-equiv="content-type">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Transmisión en vivo, chat y cuenta regresiva de carreras F1 en español.">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://via.placeholder.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://newsdata.io https://cloudflareinsights.com https://cdn.jsdelivr.net https://*.ngrok.io https://*.ngrok-free.app; media-src 'self' https://*.ngrok.io https://*.ngrok-free.app; frame-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests">
    <title>En Vivo</title>
    <link rel="icon" href="../../img/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="../../img/Formula-1-Fans-Global3.jpg">
    <link rel="manifest" href="../../manifest.webmanifest">
    <meta name="theme-color" content="#121212">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/menu.css">
    <link rel="stylesheet" href="../../css/en-vivo.css">
    <link rel="stylesheet" href="../../css/footer.css">
    <link rel="stylesheet" href="../../css/breadcrumbs.css">
    <link rel="stylesheet" href="../../css/notifications.css">
</head>
<body>
    <!-- Menú de navegación -->
    <div id="nav-container"></div>

    <!-- Contenido principal En Vivo -->
    <main id="en-vivo-main" role="main" aria-labelledby="event-title">
        <div class="live-container">
            <!-- Columna izquierda: Info y Contador -->
            <div class="live-sidebar">
                <!-- Banner del evento -->
                <header class="event-banner">
                    <div class="event-info">
                        <div class="event-badge">🏁 F1 LIVE</div>
                        <h1 id="event-title">PRUEBAS DE PRETEMPORADA</h1>
                        <p id="event-subtitle">PRETEMPORADA 2026</p>
                    </div>
                </header>

                <!-- Contador con estilo moderno -->
                <aside class="countdown-card" aria-label="Cuenta regresiva">
                    <div class="countdown-header">
                        <span class="countdown-icon">⏱️</span>
                        <h2 id="ronda-info">RONDA 0</h2>
                    </div>
                    <div id="contador" class="countdown-display">
                        <div class="time-block">
                            <span id="dias" class="time-value">00</span>
                            <span class="time-label">DÍAS</span>
                        </div>
                        <div class="time-block">
                            <span id="horas" class="time-value">00</span>
                            <span class="time-label">HRS</span>
                        </div>
                        <div class="time-block">
                            <span id="minutos" class="time-value">00</span>
                            <span class="time-label">MIN</span>
                        </div>
                        <div class="time-block">
                            <span id="segundos" class="time-value">00</span>
                            <span class="time-label">SEG</span>
                        </div>
                    </div>
                </aside>

                <!-- Info adicional -->
                <div class="race-info">
                    <div class="info-item">
                        <span class="info-icon">📍</span>
                        <div class="info-text">
                            <strong>Ubicación</strong>
                            <p>Baréin</p>
                        </div>
                    </div>
                    <div class="info-item">
                        <span class="info-icon">🏎️</span>
                        <div class="info-text">
                            <strong>Cronograma</strong>
                            <p>Día 1 de Pruebas</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Columna derecha: Stream -->
            <div class="live-main">
                <section class="stream-wrapper" aria-label="Transmisión en vivo">
                    <!-- Indicador EN VIVO flotante -->
                    <div id="live-indicator" class="live-badge-top hidden">
                        <span class="pulse-dot"></span>
                        <span>EN VIVO</span>
                    </div>

                    <div class="stream-container">
                        <img id="pre-image" src="../../img/Pilotos-f1-2025.jpg" alt="Esperando el stream" class="stream-bg" loading="lazy">
                        <video id="live-video" class="stream-video" controls playsinline preload="metadata" crossorigin="anonymous" poster="../../img/Pilotos-f1-2025.jpg">
                            <source src="../../videos/Presentacion-Pilotos-F1-2025.mp4" type="video/mp4">
                            Tu navegador no soporta el elemento de video.
                        </video>
                        <img id="post-image" src="../../img/Pilotos-f1-2025.jpg" alt="Stream finalizado" class="stream-bg" loading="lazy">

                        <!-- Botón play central -->
                        <button id="live-button" class="play-button" aria-controls="play-modal">
                            <span class="play-icon">▶</span>
                            <span class="live-dot"></span>
                            <span class="play-text">TRANSMISIÓN EN VIVO</span>
                        </button>
                    </div>
                </section>
            </div>
        </div>

        <!-- Modal moderno -->
        <div id="play-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="play-modal-title" aria-describedby="play-modal-desc">
            <div class="modal-box">
                <button id="close-modal-btn" class="modal-close-btn" aria-label="Cerrar">✕</button>
                <div class="modal-header">
                    <h2 id="play-modal-title">🏁 Opciones de reproducción</h2>
                    <p id="play-modal-desc">La transmisión está disponible. Elige cómo ver:</p>
                </div>
                <div class="modal-options">
                    <button id="play-live-btn" class="option-card card-live">
                        <span class="option-icon">🔴</span>
                        <h3>Ver en Vivo</h3>
                        <p>Únete a la transmisión actual</p>
                    </button>
                    <button id="play-from-start-btn" class="option-card card-start">
                        <span class="option-icon">⏮️</span>
                        <h3>Desde el Inicio</h3>
                        <p>Ver desde el comienzo</p>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12/dist/hls.min.js" integrity="sha384-miJUhTuRucSoqFe3/VSB2sRghSMoev6wpPoEyj5fhF0PARehD+naPBsAkl5NqwPO" crossorigin="anonymous"></script>
    <script src="../../js/hls-config.js" defer></script>
    <script src="../../js/menu.js" defer></script>
    <script src="../../js/theme-toggle.js" defer></script>
    <script src="../../js/lazy-images.js" defer></script>
    <script src="../../js/notifications.js" defer></script>
    <script src="../../js/breadcrumbs.js" defer></script>
    <script src="../../js/stream.js" defer></script>
    <script src="../../js/contador.js" defer></script>
    <script src="../../js/footer.js" defer></script>
</body>
</html>
