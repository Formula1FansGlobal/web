<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Calendario, ganadores y clasificación final de cualquier temporada de la Fórmula 1 desde 1950, en español.">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.jolpi.ca https://cloudflareinsights.com; media-src 'self'; frame-src 'none'; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests">
    <title>Temporada de F1 | Formula 1 Fans Global</title>
    <link rel="icon" href="../../img/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="../../img/Formula-1-Fans-Global3.jpg">
    <link rel="manifest" href="../../manifest.webmanifest">
    <meta name="theme-color" content="#0b0b0e">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/tokens.css">
    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/menu.css">
    <link rel="stylesheet" href="../../css/sesiones.css">
    <link rel="stylesheet" href="../../css/temporada.css">
    <link rel="stylesheet" href="../../css/tienda.css">
    <link rel="stylesheet" href="../../css/footer.css">
    <link rel="stylesheet" href="../../css/notifications.css">
</head>
<body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <div id="nav-container"></div>

    <main id="contenido">
        <header class="page-hero">
            <div class="container">
                <p class="eyebrow">Temporada</p>
                <h1 id="t-title">Temporada</h1>
                <div class="season-controls">
                    <button type="button" class="round-btn" id="t-prev" aria-label="Temporada anterior">‹</button>
                    <label>
                        <span class="sr-only">Elegir temporada</span>
                        <select class="input" id="t-select"></select>
                    </label>
                    <button type="button" class="round-btn" id="t-next" aria-label="Temporada siguiente">›</button>
                    <a class="link-arrow" href="temporadas.html">Todas las temporadas</a>
                </div>
            </div>
        </header>

        <section class="section section--tight" aria-labelledby="t-tab-title">
            <div class="container">
                <div class="section-head">
                    <h2 id="t-tab-title" class="sr-only">Contenido de la temporada</h2>
                    <div class="tabs tabs--scroll" role="tablist" aria-label="Secciones de la temporada">
                        <button class="tab is-active" role="tab" aria-selected="true" id="tab-calendario" data-tab="calendario" aria-controls="t-panel">Calendario</button>
                        <button class="tab" role="tab" aria-selected="false" id="tab-pilotos" data-tab="pilotos" aria-controls="t-panel" tabindex="-1">Pilotos</button>
                        <button class="tab" role="tab" aria-selected="false" id="tab-constructores" data-tab="constructores" aria-controls="t-panel" tabindex="-1">Constructores</button>
                    </div>
                </div>
                <div id="t-panel" role="tabpanel" aria-labelledby="tab-calendario" aria-live="polite">
                    <div class="skeleton" style="height: 240px"></div>
                </div>
                <p class="data-credit">Datos: Jolpica F1 API (compatible con Ergast). Las temporadas en curso se actualizan tras cada carrera.</p>
            </div>
        </section>
    </main>

    <script src="../../js/menu.js" defer></script>
    <script src="../../js/theme-toggle.js" defer></script>
    <script src="../../js/notifications.js" defer></script>
    <script src="../../js/f1-data.js" defer></script>
    <script src="../../js/temporada.js" defer></script>
    <script src="../../js/footer.js" defer></script>
</body>
</html>
