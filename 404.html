<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Página no encontrada | Formula 1 Fans Global</title>
    <style>
        :root { color-scheme: dark light; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px;
               font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: #0b0b0e; color: #f5f5f7; }
        @media (prefers-color-scheme: light) { body { background: #f5f5f8; color: #15151b; } }
        h1 { font-size: clamp(4rem, 16vw, 8rem); margin: 0; line-height: 1; color: #e10600; letter-spacing: -0.04em; }
        p { max-width: 42ch; margin: 12px auto 28px; opacity: 0.8; line-height: 1.6; }
        a { display: inline-block; background: #e10600; color: #fff; text-decoration: none; padding: 12px 24px; border-radius: 999px; font-weight: 600; }
    </style>
</head>
<body>
    <main>
        <h1>404</h1>
        <h2>Esta vuelta no está en el circuito</h2>
        <p>La página que buscas no existe o cambió de lugar. Regresa a boxes y sigue desde el inicio.</p>
        <a id="home" href="/">Volver al inicio</a>
    </main>
    <script>
        // En GitHub Pages de proyecto el sitio vive en /<repo>/; en dominio propio vive en la raíz.
        (function () {
            var partes = location.pathname.split('/').filter(Boolean);
            var base = /\.github\.io$/.test(location.hostname) && partes.length ? '/' + partes[0] + '/' : '/';
            document.getElementById('home').setAttribute('href', base);
        })();
    </script>
</body>
</html>
